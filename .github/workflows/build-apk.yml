name: Сборка APK

# Запускается при каждом обновлении ветки main (или вручную во вкладке Actions)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# нужно для шага, который сохраняет ключ подписи и создает Релизы
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # пароль от ключа подписи (для личного приложения достаточно)
      KS_PASS: gymlog-secret-pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Копирование сайта в www/
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.webmanifest sw.js www/
          cp -r icons www/icons

      - name: Генерация иконок и splash для Android
        run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#0f172a' --iconBackgroundColorDark '#0f172a'
          --splashBackgroundColor '#0f172a' --splashBackgroundColorDark '#0f172a'

      - name: Генерация Android-проекта
        run: npx cap add android && npx cap sync android

      # известная проблема: старые kotlin-stdlib-jdk7/jdk8 дублируют классы
      # из новой kotlin-stdlib (1.8+) — исключаем старые модули
      - name: Фикс дубликатов kotlin
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Ключ подписи
        run: |
          if [ -f keystore.b64 ]; then
            echo "Ключ подписи найден в репозитории — использую его"
            base64 -d keystore.b64 > gymlog.keystore
          else
            echo "Ключа нет — генерирую новый и сохраняю в репозиторий"
            keytool -genkeypair -v -keystore gymlog.keystore -alias gymlog \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=GymLog, OU=GymLog, O=GymLog, L=City, ST=State, C=RU"
            base64 -w0 gymlog.keystore > keystore.b64
            git config user.name "gymapp-bot"
            git config user.email "actions@github.com"
            git add keystore.b64
            git commit -m "Сохраняю ключ подписи APK"
            git push
            echo "KEY_SAVED=1" >> "$GITHUB_ENV"
          fi

      # при первой сборке на этом всё заканчивается:
      # сохранение ключа запускает вторую сборку, она выпустит APK

      - name: Сборка release-версии
        if: env.KEY_SAVED == ''
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Подпись APK
        if: env.KEY_SAVED == ''
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)"
          SRC="$(ls android/app/build/outputs/apk/release/*.apk | head -n1)"
          "$BT/zipalign" -f 4 "$SRC" aligned.apk
          "$BT/apksigner" sign --ks gymlog.keystore --ks-key-alias gymlog \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out GymLog.apk aligned.apk
          "$BT/apksigner" verify GymLog.apk
          echo "APK готов: GymLog.apk"

      - uses: actions/upload-artifact@v4
        if: env.KEY_SAVED == ''
        with:
          name: GymLog-apk
          path: GymLog.apk

      - name: Публикация релиза на GitHub
        if: env.KEY_SAVED == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "GymLog v${{ github.run_number }}"
          body: |
            Сборка #${{ github.run_number }}
            Коммит: ${{ github.sha }}
            Изменения: ${{ github.event.head_commit.message }}
          files: GymLog.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
